name: Bug report
description: Report a reproducible problem in Waddeh
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Waddeh. Use safe demo content only—never attach private Arabic documents, credentials, account identifiers, or environment files.
  - type: input
    id: route
    attributes:
      label: Page or route
      placeholder: /reading/… or /learning/vocabulary
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language
      options:
        - Arabic (RTL)
        - English (LTR)
        - Both
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use non-sensitive sample text and provide the smallest reliable sequence.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and viewport
      placeholder: Chrome 130, Windows 11, 390×844
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add sanitized screenshots or console output only if they contain no secrets, emails, UIDs, or private documents.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, environment values, account identifiers, personal information, and private documents.
          required: true
