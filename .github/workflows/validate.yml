name: Validate

on:
  push:
    branches:
      - main
      - competition/**
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:frontend

      - name: TypeScript
        run: npm exec --workspace frontend -- tsc --noEmit

      - name: Production build
        run: npm run build:frontend

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Pytest
        run: python -m pytest backend/tests

      - name: Deterministic evaluation
        run: python evaluation/check_deterministic.py
