name: Feature request
description: Propose a focused improvement to Arabic understanding or progressive learning
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Waddeh focuses on controlled Arabic readability, contextual learning, meaning preservation, and progress toward authentic source language.
  - type: textarea
    id: learner_problem
    attributes:
      label: Learner problem
      description: What difficulty does an Arabic learner face today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the smallest useful change and where it belongs in the current journey.
    validations:
      required: true
  - type: dropdown
    id: mission
    attributes:
      label: Primary product contribution
      options:
        - Controlled readability
        - Personalized adaptation
        - Meaning preservation
        - Contextual vocabulary learning
        - Progress toward original Arabic
        - Accessibility or RTL/LTR quality
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain why an existing Waddeh capability does not already solve the problem.
  - type: textarea
    id: validation
    attributes:
      label: Success criteria
      description: Describe observable behavior without inventing metrics or user-test results.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal does not turn Waddeh into a generic chatbot, translator, or PDF chat tool.
          required: true
        - label: I have not included private documents, credentials, account identifiers, or personal data.
          required: true
