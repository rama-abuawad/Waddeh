<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Waddeh logo icon">
  <defs>
    <linearGradient id="bg" x1="70" y1="40" x2="452" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11A789"/>
