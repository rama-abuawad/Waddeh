[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waddeh-backend"
version = "0.1.0"
description = "Adaptive Arabic reading API for Waddeh"
requires-python = "~=3.12.0"
dependencies = [
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "pydantic-settings==2.8.1",
    "pypdf==6.16.1",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "pytest-cache-files-*"]
